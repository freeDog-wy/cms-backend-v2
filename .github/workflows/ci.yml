name: CMS Backend v2 CI

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cms_test
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: cms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cms_test -d cms_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test and validate deployment configuration
        env:
          TEST_DATABASE_URL: postgres://cms_test:ci_test_only@127.0.0.1:5432/cms_test?sslmode=disable
        run: |
          set -euo pipefail
          go test -race -count=1 ./...
          go vet ./...
          bash -n deploy/deploy.sh
      - name: Build production server
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/cms-server ./cmd/server
