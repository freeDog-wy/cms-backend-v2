name: Build and Deploy CMS Backend v2

on:
  workflow_dispatch:
  push:
    tags: ["cms-backend-v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      image_ref: ${{ steps.reference.outputs.image_ref }}
      source_ref: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Resolve source and image name
        id: source
        env:
          NAMESPACE: ${{ vars.CCR_NAMESPACE || 'pigpig' }}
          IMAGE_NAME: ${{ vars.CCR_IMAGE_NAME || 'cms-backend-v2' }}
        run: |
          set -euo pipefail
          [[ "$NAMESPACE" =~ ^[a-z0-9][a-z0-9._-]*$ ]]
          [[ "$IMAGE_NAME" =~ ^[a-z0-9][a-z0-9._-]*$ ]]
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "repository=ccr.ccs.tencentyun.com/$NAMESPACE/$IMAGE_NAME" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to Tencent CCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.CCR_USERNAME }}
          password: ${{ secrets.CCR_PASSWORD }}
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/amd64' }}
          tags: ${{ steps.source.outputs.repository }}:sha-${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Export immutable digest reference
        id: reference
        env:
          REPOSITORY: ${{ steps.source.outputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image_ref=$REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    uses: ./.github/workflows/deploy.yml
    with:
      image_ref: ${{ needs.build.outputs.image_ref }}
      source_ref: ${{ needs.build.outputs.source_ref }}
    secrets: inherit
